name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  selftest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Pillow + CJK font
        run: |
          python -m pip install --upgrade pip pillow
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk
      - name: Render all four pages
        run: python agent_status.py --selftest
      - name: Wrap / clean regression tests
        run: python tests/test_wrap.py
