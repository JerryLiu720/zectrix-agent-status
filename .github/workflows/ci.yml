name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  selftest:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Pillow
        run: python -m pip install --upgrade pip pillow
      - name: Render all four pages
        run: python agent_status.py --selftest
      - name: Wrap / clean regression tests
        run: python tests/test_wrap.py
